<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.title | escape }} · {{ site.name | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% assign canonical_path = page.canonical_path | default: page.url %}
    <link rel="canonical" href="{{ canonical_path | absolute_url }}">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/editorial.css' | relative_url }}?v=native-figures-1">
    {% if site.mathjax and page.math != false and page.layout != 'blog' %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.name | escape }}</a>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"{% if page.section == 'blog' or page.layout == 'post' or page.layout == 'post_default' %} aria-current="page"{% endif %}>Blog</a>
          <a href="{{ '/about' | relative_url }}"{% if page.section == 'about' %} aria-current="page"{% endif %}>About</a>
        </nav>
      </header>
      <main id="main">{{ content }}</main>
    </div>
  </body>
</html>
